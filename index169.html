<meta name="description" content="Esta Aparição da Virgem Maria em
Pontmain na França, caracteriza de modo inequívoco, uma preciosa
intervenção Divina, com o objetivo de acabar com a guerra entre a
Alemanha e a França, evitando as barbaridades de um entrevero
militar, assim como a morte de pessoas inocentes, causando infelicidades
a muitas famílias. A Mãe de Deus apareceu a quatro crianças, aumentando
a confiança dos moradores, no mesmo momento em que o Senhor impedia
a invasão programada pelo exército invasor. É uma minifestação
bonita e emocionante.">
