Criador. Além das suas atividades no cotidiano, sua existência sempre permanece
direcionada a Deus. E tanto amou o Senhor em vida, que ao longo de seus dias recebeu preciosas
carícias Divina, com o senhor realizando milagres admiráveis atendendo as suplicantes orações
de intercessão que ela fazia, em face dos pedidos do povo.">
