preocupado em tornar bem conhecida a verdade cristã. E porisso preocupou-se

em instruir seus conterraneos e também levar DEUS para que todos os povos

também O conhecessem, através das Missões. Fundou a Revista "O Pequeno

Mensageiro do Sagrado Coração"; fundou a "Congregação Religiosa do Verbo

Divino"; fundou a celebre "Casa Missionária de São Miguel" em Steyl; 

fundou os "Irmãos e as Irmãs Missionárias", e também fundou as
