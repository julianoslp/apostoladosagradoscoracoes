gerações têm o direito de conhecer e amar! Foi o fundador da Ordem
dos Padres Pregadores, também denominada de Ordem Dominicana. Recebeu
de Nossa Senhora o Rosário, como instrumento especial e de valor excepcional,
para ajudá-lo a converter os heresiarcas do sul da França. Ao longo da vida,
deu relevo a dois valores que considerava indispensáveis para o bom êxito 
da missão evangelizadora: a vida comunitária na pobreza e no estudo".>
