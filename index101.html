<META NAME="description" content="Luzia era uma jovem desejosa de imitar a Virgem 

Maria,sempre com a intenção de seguir mais próximo e acompanhar os passos de

Jesus. E para seguir o Senhor, ela desfez de todos os seus bens em beneficio

dos pobres e dos mais necessitados. E por decisão Divina, o nome de Lúcia, foi 

a luz que se transformou em Luzia, iluminando o seu dom Divino, intercedendo

junto a Deus em beneficio dos fieis com doenças nos olhos ou cegueira.”>
