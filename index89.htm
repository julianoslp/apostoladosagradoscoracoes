<META NAME="description" content="Geraldo Magela desde a infância foi

um homem determinado e apaixonado pelo nosso Deus. Entretanto sua

constituição física muito fragil propunha a impressão de uma pessoa doente,

dificultando assim a realização do seu projeto de se tornar um religioso,

que conseguiu por fim, graças a sua perseverança, e a manifestação da

Vontade Divina. De coração bondoso numa alma caridosa, dedicou-se aos 

pobres, principalmente aos doentes. Foi alfaiate e se tornou tambén

protetor das mães, principalmente daquelas do primeiro parto. Revelou

um notável poder intercessor junto a DEUS, conseguindo graças excepcionais,

que o tornaram um magnífico Santo popular".>
