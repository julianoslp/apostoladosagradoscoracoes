<META NAME="description" content="É a primeira Santa da America do Sul. Alma
simples e modesta, viveu na pobreza e humildade, preocupando-se em salvar
almas e converter os pecadores. Rezava o Rosario com fé e confiança, porque
amava a Virgem Maria e Jesus era o seu alimento diário na Eucaristia. Entrou
na Ordem Terceira Dominicana e sua vida se constituiu na realidade de rezar
e sofrer pelos outros, por amor a Deus. Numa tentativa de invasão dos piratas
holandeses que queriam saquear a cidade, ela convocou os cristãos e fizeram
um mutirão de orações, afugentando e afastando os perversos piratas.">
