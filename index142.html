<meta NAME="description" content= "O Rosário é uma santa Oração.
Nele há a Oração mental e vocal. A mental consiste na meditação dos
Mistérios da Vida, Morte e Glória de Jesus e de Nossa Senhora. A
Oração vocal consiste em recitar as dezenas da Ave Maria, precedidas
por um Pai Nosso. Reza-lo bem, com atenção e fervor, é o grande
e admirável segredo da Oração. Este é o objetivo deste Site.">
