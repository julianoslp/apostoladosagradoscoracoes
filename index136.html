<meta NAME="description" content= "Quando Jesus na Última Ceia,
instituiu a Sagrada Eucaristia (Santa Missa), declarou que o pão
era o Seu Corpo entregue por nós, e que o vinho era o Seu Sangue
derramado por nós. Então fica evidente que a Santa Missa é a repetição
do Sacrifício do Calvário, um sacrifício real, mas sem derramamento
de sangue (incruento). A Sagrada Eucaristia é a presença Real do 
próprio  Deus".>
